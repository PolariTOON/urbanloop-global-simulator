<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link type="text/css" rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link type="text/css" rel="stylesheet" href="./web/style.css"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
          integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
    <link rel="shortcut icon" href="./web/favicon.ico">
    <title>Urbanloop Simulator</title>
</head>
<body>
<div class="container-fluid table-container h-100">
    <div class="row table-row h-100">
        <div class="col-md-9 no-float table-col" id="network-div"></div>
        <div class="col-md-3 no-float table-col" id="panel-div">
            <div id="timer-div">
                <span id="timer-span" class="badge badge-light">Day -<br><br>--:--:--</span>
            </div>
            <div id="buttons-div">
                <button type="button" class="btn btn-success" id="start-button">Start</button>
                <button type="button" class="btn btn-danger not-shown" id="stop-button">Stop</button>
                <button type="button" class="btn btn-info" id="pause-button">Pause</button>
                <button type="button" class="btn btn-light" id="backward-button"><i class="fas fa-fast-backward"></i></button>
                <button type="button" class="btn btn-light" id="forward-button"><i class="fas fa-fast-forward"></i></button>
            </div>
            <div id="speed-div">
                <span id="speed-span" class="badge badge-light">Speed</span>
            </div>
            <hr/>
            <ul class="nav nav-tabs" id="view-list">
                <li class="nav-item">
                    <a class="nav-link" id="data-tab" onClick="generateDataPanel()">Data</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="config-tab" onClick="generateConfigPanel()">Config</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="interract-tab" onClick="generateInterractPanel()">Interract</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="view-tab" onClick="generateViewPanel()">View</a>
                </li>
            </ul>
            <div id="tab-content">
            </div>
            <div id="slider-container">
                <input type="range" min="1" max="50" value="1" id="scale-slider">
            </div>
        </div>
    </div>
</div>

</body>
<footer>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/4.5.1/pixi.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/konva@3.1.6/konva.min.js"></script>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js" integrity="sha384-b/U6ypiBEHpOf/4+1nzFpr53nxSS+GLCkfwBdFNTxtclqqenISfwAzpKaMNFNmj4" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="./web/objects.js"></script>
    <script type="text/javascript" src="./web/renderer.js"></script>
    <script type="text/javascript" src="./web/tabs.js"></script>
    <script type="text/javascript" src="./web/inputs.js"></script>
</footer>
</html>
